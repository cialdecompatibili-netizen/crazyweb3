{
  "installed": {
    "esempio-banner": {
      "name": "Banner di esempio",
      "enabled": false,
      "hooks": {
        "footer": "footer.liquid"
      },
      "config_fields": [
        { "key": "text", "type": "text", "label": "Testo del banner", "default": "Modulo di esempio attivo - installato dall'admin, sezione Moduli." },
        { "key": "color", "type": "text", "label": "Colore di sfondo (es. #2271b1)", "default": "#2271b1" }
      ],
      "roots": []
    },
    "sitemap": {
      "name": "Sitemap XML",
      "enabled": true,
      "hooks": {},
      "config_fields": [
        { "key": "exclude_paths", "type": "textarea", "label": "Percorsi da escludere (uno per riga, anche parziali: es. /admin/, /tag/, /category/, /page/)", "default": "/admin/\n/_pages/\n/tag/\n/category/\n/page/" },
        { "key": "include_lastmod", "type": "checkbox", "label": "Includi la data di ultima modifica (lastmod) dove disponibile", "default": "true" }
      ],
      "roots": ["sitemap.xml"]
    }
  }
}